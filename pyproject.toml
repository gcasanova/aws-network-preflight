[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "aws-network-preflight"
version = "0.1.0"
description = "Declare your AWS network intent in YAML and verify that connectivity still matches it."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Guillermo Casanova" },
]
keywords = ["aws", "networking", "sre", "cli", "reachability-analyzer"]
dependencies = [
  "boto3>=1.34.0",
  "pydantic>=2.7.0",
  "PyYAML>=6.0.1",
  "rich>=13.7.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.4.0",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
aws-network-preflight = "preflight.cli:app"

[project.urls]
Homepage = "https://github.com/gcasanova/aws-network-preflight"
Repository = "https://github.com/gcasanova/aws-network-preflight"

[tool.hatch.build.targets.wheel]
packages = ["preflight"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
ignore_missing_imports = true
